<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Chat API Server</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
      }
      h1 {
        font-size: 2.5em;
        margin-bottom: 0.5em;
        color: #2b7a78;
      }
      p {
        font-size: 1.2em;
        color: #555;
      }
      code {
        background-color: #eee;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>👋 Welcome to Realtime Chat API Server</h1>
      <p>This is the root route. The server is up and running.</p>
      <p>Try accessing <code>/your-service-endpoint</code> to get started.</p>
    </div>
    <script>
      (function () {
        var map = {
          "chatapp-be.ritwikrajsingh.com": "https://ritwikrajsingh.com",
          "chatapp-be.dipanshushukla.com": "https://dipanshushukla.com",
          localhost: "http://localhost:3000",
          "127.0.0.1": "http://127.0.0.1:3000",
        };

        var host = map[window.location.hostname];
        if (!host) return;

        var s = document.createElement("script");
        s.src = host + "/badge.js";
        s.setAttribute("data-host", host);
        s.setAttribute("data-position", "60");
        s.setAttribute("data-type", "regular");
        s.setAttribute("data-theme", "light");
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
